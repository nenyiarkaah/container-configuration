#region services
  services:
    proxmox:
      loadBalancer:
        servers:
          - url: https://cordelia:8006
        passHostHeader: true
    proxmox-pve:
      loadBalancer:
        servers:
          - url: http://prometheus-pve-exporter:9221
        passHostHeader: true
    synology-dsm:
      loadBalancer:
        servers:
          - url: http://rosalind:5000
        passHostHeader: true
    transmission:
      loadBalancer:
        servers:
          - url: http://phobos:9091
        passHostHeader: true
    overseerr:
      loadBalancer:
        servers:
          - url: http://overseerr:5055
        passHostHeader: true
    lidarr:
      loadBalancer:
        servers:
          - url: http://lidarr:8686
        passHostHeader: true
    prowlarr:
      loadBalancer:
        servers:
          - url: http://prowlarr:9696
        passHostHeader: true
    radarr:
      loadBalancer:
        servers:
          - url: http://radarr:7878
        passHostHeader: true
    sonarr:
      loadBalancer:
        servers:
          - url: http://sonarr:8989
        passHostHeader: true
    whisparr:
      loadBalancer:
        servers:
          - url: http://whisparr:6969
        passHostHeader: true
    whisparrv3:
      loadBalancer:
        servers:
          - url: http://juliet:6969
        passHostHeader: true
    n8n:
      loadBalancer:
        servers:
          - url: http://n8n:5678
        passHostHeader: true
    mint:
      loadBalancer:
        servers:
          - url: http://mint
        passHostHeader: true
    prometheus:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
        passHostHeader: true
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
        passHostHeader: true
    rabbitmq:
      loadBalancer:
        servers:
          - url: http://rosalind:15672
        passHostHeader: true
#endregion
  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.198.0/16"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers
        