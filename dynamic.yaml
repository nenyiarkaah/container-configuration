certificatesResolvers:
  cloudflare:
    acme:
      email: "${EMAIL}" # <-- Change this to your email

# enable the dashboard via a router on your domain
http:
  routers:
    traefik-dashboard:
      rule: 'Host(`{{ env "TRAEFIK_DASHBOARD_DOMAIN" }}`)'
      service: api@internal
      entryPoints:
        - websecure
      tls:
        certResolver: "cloudflare"
        domains:
          - main: '{{ env "DOMAIN" }}'
            sans:
              - '{{ env "WILDCARD_DOMAIN" }}'
    proxmox:
      entryPoints:
        - websecure
      rule: "Host(`proxmox.{{ env `DOMAIN` }}`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: proxmox
    proxmox-pve:
      entryPoints:
        - websecure
      rule: "Host(`proxmox-pve.{{ env `DOMAIN` }}`)"
