certificatesResolvers:
  cloudflare:
    acme:
      email: "${EMAIL}" # <-- Change this to your email

# enable the dashboard via a router on your domain
http:
  routers:
    traefik-dashboard:
      rule: 'Host(`{{ env "TRAEFIK_DASHBOARD_DOMAIN" }}`)'
      service: api@internal
      entryPoints:
        - websecure
      tls:
        certResolver: "cloudflare"
        domains:
          - main: '{{ env "DOMAIN" }}'
            sans:
              - '{{ env "WILDCARD_DOMAIN" }}'
    n8n:
      entryPoints:
        - websecure
      rule: "Host(`n8n.{{ env `DOMAIN` }}`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: n8n
    prometheus:
      entryPoints:
        - websecure
      rule: "Host(`prometheus.{{ env `DOMAIN` }}`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: prometheus
    grafana:
      entryPoints:
        - websecure
      rule: "Host(`grafana.{{ env `DOMAIN` }}`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: grafana
#endregion
#region services
  services:
    n8n:
      loadBalancer:
        servers:
          - url: http://n8n:5678
        passHostHeader: true
    prometheus:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
        passHostHeader: true
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
        passHostHeader: true
#endregion
  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.184.0/16"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers
        