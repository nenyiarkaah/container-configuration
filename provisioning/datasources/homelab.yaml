apiVersion: 1

# Direct to the Prometheus LXC, so dashboards don't depend on the *.safetypin.me.uk proxy.
# The UI-created "prometheus" datasource (via https://prometheus.safetypin.me.uk) is left as is.
datasources:
  - name: Prometheus (direct)
    uid: prometheus-direct
    type: prometheus
    access: proxy
    url: http://10.140.50.125:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 1m
