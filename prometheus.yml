rule_files:
  - rules/*.yml

# Alertmanager on this LXC (server-scripts, --tags alerting) posts to Slack #homelab-alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: 'pve'
    static_configs:
      - targets:
        - 10.140.50.20:8006  # Proxmox VE node.
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.140.50.145:9221  # PVE exporter IP address and port number - use docker host IP, not localhost

  - job_name: 'node'
    static_configs:
      - targets: ['10.140.10.5:9100']
        labels: {host: prospero}
      - targets: ['10.140.50.240:9100']
        labels: {host: cressida}
      - targets: ['10.140.10.115:9100']
        labels: {host: francisco}
      - targets: ['10.140.50.10:9100']
        labels: {host: phobos}
      - targets: ['10.140.50.235:9100']
        labels: {host: juliet}
      - targets: ['10.140.50.140:9100']
        labels: {host: miranda}
    # ariel, belinda, desdemona, portia, perdita and ophelia sit on a second network
    # this Prometheus cannot reach; they need their own scrape path (Homelab Plan).

  # Per-container metrics (Ansible monitoring role, enable_cadvisor).
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['10.140.50.235:9338']
        labels: {host: juliet}
      - targets: ['10.140.50.140:9338']
        labels: {host: miranda}
      - targets: ['10.140.10.5:9338']
        labels: {host: prospero}
      - targets: ['10.140.10.115:9338']
        labels: {host: francisco}
      - targets: ['10.140.50.240:9338']
        labels: {host: cressida}

  # Rosalind (Synology) over SNMPv3, through the exporter on juliet (Ansible
  # monitoring role, enable_snmp_exporter). Credentials live in the exporter, not here.
  - job_name: 'snmp'
    metrics_path: /snmp
    params:
      module: [synology, if_mib]
      auth: [rosalind]
    static_configs:
      - targets: ['10.140.50.5']
        labels: {host: rosalind}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.140.50.235:9116

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels: {host: prometheus}

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['localhost:9093']
        labels: {host: prometheus}
