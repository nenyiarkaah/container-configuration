rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: 'pve'
    static_configs:
      - targets:
        - 10.140.50.20:8006  # Proxmox VE node.
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.140.50.145:9221  # PVE exporter IP address and port number - use docker host IP, not localhost

  - job_name: 'node'
    static_configs:
      - targets:
        - 10.140.10.5:9100     # prospero
        - 10.140.50.240:9100   # cressida
        - 10.140.10.115:9100   # francisco
        - 10.140.50.10:9100    # phobos
        - 10.140.50.235:9100   # juliet
        - 10.140.50.140:9100   # miranda
    # ariel, belinda, desdemona, portia, perdita and ophelia sit on a second network
    # this Prometheus cannot reach; they need their own scrape path (Homelab Plan).

  # Per-container metrics (Ansible monitoring role, enable_cadvisor)
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets:
        - 10.140.50.235:9338   # juliet
        - 10.140.50.140:9338   # miranda
        - 10.140.10.5:9338     # prospero
        - 10.140.10.115:9338   # francisco
        - 10.140.50.240:9338   # cressida
    # The Pis boot with cgroup_disable=memory, so they report no per-container memory.

  - job_name: 'prometheus'
    static_configs:
      - targets:
        - localhost:9090
