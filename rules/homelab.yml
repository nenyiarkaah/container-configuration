groups:
  - name: scheduled-containers
    rules:
      # Written by run-scheduled-container.sh (server-scripts) after every run
      - alert: ScheduledContainerFailed
        expr: scheduled_container_last_exit_code != 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} on {{ $labels.instance }} exited with {{ $value }}'
          description: 'See ~/containers/logs/{{ $labels.name }}.log on the host.'

      # Daily jobs: allow two hours of slack after the expected run
      - alert: ScheduledContainerMissed
        expr: time() - scheduled_container_last_run_timestamp_seconds > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} on {{ $labels.instance }} has not run for over 26 hours'

  - name: backups
    rules:
      # Written by run-backup.sh (server-scripts) after every weekly rsync to Rosalind
      - alert: BackupFailed
        expr: backup_last_exit_code != 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} backup on {{ $labels.host }} exited with {{ $value }}'
          description: 'See /var/log/{{ $labels.name }}.log on the host. 23 = some files or attributes not transferred.'

      # Weekly jobs: allow a day of slack
      - alert: BackupMissed
        expr: time() - backup_last_run_timestamp_seconds > 8 * 86400
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.name }} backup on {{ $labels.host }} has not run for over 8 days'

  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} target {{ $labels.host }} ({{ $labels.instance }}) is down'

  - name: hosts
    rules:
      # Would have caught the 2026-10-17 juliet OOM (leaked ssh-agents, host processes)
      - alert: NodeMemoryAvailableLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} has {{ $value | humanizePercentage }} memory available'

      # Would have caught juliet's root disk at 0.1 % free (2026-10-29)
      - alert: NodeFilesystemAlmostFull
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|nfs.*|fuse.*|vfat"}
          / node_filesystem_size_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free'

      # LXC root disks, from the PVE exporter: would have caught Grafana's full disk (2026-10-27)
      - alert: ProxmoxGuestDiskAlmostFull
        expr: >-
          pve_disk_usage_bytes{id=~"lxc/.*"} / pve_disk_size_bytes
          * on(id) group_left(name) pve_guest_info > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'LXC {{ $labels.name }} ({{ $labels.id }}) root disk is {{ $value | humanizePercentage }} full'
